<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Silk Wave — Shader Lab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; overflow: hidden; }
  #container { display: flex; height: 100vh; }
  #canvas-container { flex: 1; position: relative; background: #fff; }
  canvas { display: block; width: 100%; height: 100%; }
  #controls { width: 320px; background: #fff; padding: 24px; overflow-y: auto; box-shadow: -2px 0 8px rgba(0,0,0,.1); }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; color: #0f172a; }
  .description { font-size: 13px; color: #64758b; margin-bottom: 20px; line-height: 1.5; }
  .control-group { margin-bottom: 16px; }
  label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; color: #334155; margin-bottom: 6px; }
  .value-display { font-size: 12px; color: #64758b; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; height: 4px; border-radius: 2px; background: #e2e8f0; outline: none; -webkit-appearance: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #0f172a; cursor: pointer; }
  input[type=color] { width: 100%; height: 34px; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; background: #fff; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: #94a3b8; margin: 20px 0 12px; }
  button { width: 100%; padding: 10px; background: #0f172a; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; }
  button:hover { background: #334155; }
  button.secondary { background: #f1f5f9; color: #334155; }
  button.secondary:hover { background: #e2e8f0; }
</style>
</head>
<body>
<div id="container">
  <div id="canvas-container"></div>
  <div id="controls">
    <h1>Silk Wave</h1>
    <p class="description">Near-white silk folds with sharp specular creases and a faint glassy diffraction. Tune to match the reference, then Download PNG or Log values.</p>

    <div class="section-title">Motion &amp; Form</div>
    <div class="control-group"><label>Speed <span class="value-display" id="speed-v">0.12</span></label><input type="range" id="speed" min="0" max="0.6" step="0.01" value="0.12"></div>
    <div class="control-group"><label>Fold frequency <span class="value-display" id="foldFreq-v">2.30</span></label><input type="range" id="foldFreq" min="0.2" max="3" step="0.05" value="2.30"></div>
    <div class="control-group"><label>Warp strength <span class="value-display" id="warpStrength-v">1.60</span></label><input type="range" id="warpStrength" min="0" max="5" step="0.05" value="1.60"></div>
    <div class="control-group"><label>Warp scale <span class="value-display" id="warpScale-v">0.78</span></label><input type="range" id="warpScale" min="0.3" max="3" step="0.05" value="0.78"></div>
    <div class="control-group"><label>Rotation° <span class="value-display" id="rotation-v">40</span></label><input type="range" id="rotation" min="0" max="180" step="1" value="40"></div>
    <div class="control-group"><label>Blue amount <span class="value-display" id="blueAmount-v">0.46</span></label><input type="range" id="blueAmount" min="0" max="1" step="0.01" value="0.46"></div>

    <div class="section-title">Glassy Sheen</div>
    <div class="control-group"><label>Sheen intensity <span class="value-display" id="sheen-v">0.82</span></label><input type="range" id="sheen" min="0" max="1.5" step="0.01" value="0.82"></div>
    <div class="control-group"><label>Sheen position <span class="value-display" id="sheenPos-v">0.78</span></label><input type="range" id="sheenPos" min="0.2" max="0.95" step="0.01" value="0.78"></div>
    <div class="control-group"><label>Sheen sharpness <span class="value-display" id="sheenWidth-v">0.055</span></label><input type="range" id="sheenWidth" min="0.01" max="0.25" step="0.005" value="0.055"></div>
    <div class="control-group"><label>Iridescence <span class="value-display" id="iridescence-v">0.20</span></label><input type="range" id="iridescence" min="0" max="1" step="0.01" value="0.20"></div>

    <div class="section-title">Colors</div>
    <div class="row">
      <div class="control-group"><label>Background</label><input type="color" id="bg" value="#ffffff"></div>
      <div class="control-group"><label>Sky</label><input type="color" id="sky" value="#6ba6e0"></div>
      <div class="control-group"><label>Deep</label><input type="color" id="deep" value="#15589a"></div>
      <div class="control-group"><label>Navy</label><input type="color" id="navy" value="#173f60"></div>
    </div>

    <div class="section-title">Actions</div>
    <button class="secondary" onclick="resetParams()">Reset to defaults</button>
    <button onclick="downloadImage()">Download PNG</button>
    <button class="secondary" onclick="dumpValues()">Log values to console</button>
  </div>
</div>

<script>
const DEFAULTS = { speed:0.12, foldFreq:2.30, warpStrength:1.60, warpScale:0.78, rotation:40, blueAmount:0.46, sheen:0.82, sheenPos:0.78, sheenWidth:0.055, iridescence:0.20, bg:'#ffffff', sky:'#6ba6e0', deep:'#15589a', navy:'#173f60' };

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
const container = document.getElementById('canvas-container');
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

const material = new THREE.ShaderMaterial({
  uniforms: {
    u_time:{value:0},
    u_resolution:{value:new THREE.Vector2(container.clientWidth, container.clientHeight)},
    u_speed:{value:DEFAULTS.speed},
    u_foldFreq:{value:DEFAULTS.foldFreq},
    u_warpStrength:{value:DEFAULTS.warpStrength},
    u_warpScale:{value:DEFAULTS.warpScale},
    u_rotation:{value:DEFAULTS.rotation*Math.PI/180},
    u_blueAmount:{value:DEFAULTS.blueAmount},
    u_sheen:{value:DEFAULTS.sheen},
    u_sheenPos:{value:DEFAULTS.sheenPos},
    u_sheenWidth:{value:DEFAULTS.sheenWidth},
    u_iridescence:{value:DEFAULTS.iridescence},
    u_bg:{value:new THREE.Color(DEFAULTS.bg)},
    u_sky:{value:new THREE.Color(DEFAULTS.sky)},
    u_deep:{value:new THREE.Color(DEFAULTS.deep)},
    u_navy:{value:new THREE.Color(DEFAULTS.navy)},
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
  `,
  fragmentShader: `
    precision highp float;
    uniform float u_time, u_speed, u_foldFreq, u_warpStrength, u_warpScale, u_rotation, u_blueAmount;
    uniform float u_sheen, u_sheenPos, u_sheenWidth, u_iridescence;
    uniform vec2 u_resolution;
    uniform vec3 u_bg, u_sky, u_deep, u_navy;
    varying vec2 vUv;

    float random(vec2 st){ return fract(sin(dot(st.xy, vec2(12.9898,78.233)))*43758.5453123); }
    float noise(vec2 p){
      vec2 i=floor(p), f=fract(p);
      f=f*f*(3.0-2.0*f);
      float a=random(i), b=random(i+vec2(1.,0.)), c=random(i+vec2(0.,1.)), d=random(i+vec2(1.,1.));
      return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
    }
    float fbm(vec2 p){
      float v=0.0, amp=0.5;
      for(int i=0;i<5;i++){ v+=amp*noise(p); p*=2.0; amp*=0.5; }
      return v;
    }
    // thin sharp line centered on 'pos' in fold-space, width 'w'
    float creaseLine(float fold, float pos, float w){
      float d = abs(fold - pos);
      float l = 1.0 - smoothstep(0.0, w, d);
      return l * l; // square -> sharper, glassier core
    }

    void main(){
      vec2 uv = vUv;
      float aspect = u_resolution.x / u_resolution.y;
      uv.x *= aspect;
      float t = u_time * u_speed;

      // fold direction
      float cs=cos(u_rotation), sn=sin(u_rotation);
      vec2 ruv = vec2(uv.x*cs - uv.y*sn, uv.x*sn + uv.y*cs);

      // domain warp (feedback fbm)
      vec2 q = vec2(fbm(uv*u_warpScale + t), fbm(uv*u_warpScale + vec2(5.2,1.3) - t*0.8));
      float w = fbm(uv*u_warpScale + q*1.6 + t*0.5);

      // directional fold field -> smooth 0..1 bands
      float v = ruv.x * u_foldFreq + w * u_warpStrength;
      float fold = sin(v * 3.14159265) * 0.5 + 0.5;

      // white/blue balance
      fold = clamp(fold + (u_blueAmount - 0.5) * 0.7, 0.0, 1.0);

      // white-dominant color ramp
      vec3 col = u_bg;
      col = mix(col, u_sky,  smoothstep(0.45, 0.80, fold));
      col = mix(col, u_deep, smoothstep(0.72, 0.94, fold));
      col = mix(col, u_navy, smoothstep(0.89, 1.0, fold));

      // --- glassy crease sheen with chromatic diffraction ---
      // offset the line per-channel for iridescent fringing
      float off = u_iridescence * 0.05;
      float lR = creaseLine(fold, u_sheenPos - off, u_sheenWidth);
      float lG = creaseLine(fold, u_sheenPos,       u_sheenWidth);
      float lB = creaseLine(fold, u_sheenPos + off, u_sheenWidth);
      vec3 sheen = vec3(lR, lG, lB) * u_sheen;
      // screen-blend the sheen so it lifts toward white without hard clipping
      col = 1.0 - (1.0 - col) * (1.0 - sheen);

      gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }
  `
});

const plane = new THREE.Mesh(new THREE.PlaneGeometry(2,2), material);
scene.add(plane);

function animate(){ requestAnimationFrame(animate); material.uniforms.u_time.value = performance.now()/1000; renderer.render(scene,camera); }
animate();

window.addEventListener('resize', () => {
  const w=container.clientWidth, h=container.clientHeight;
  renderer.setSize(w,h); material.uniforms.u_resolution.value.set(w,h);
});

// --- wire up controls ---
const FLOATS = ['speed','foldFreq','warpStrength','warpScale','blueAmount','sheen','sheenPos','sheenWidth','iridescence'];
FLOATS.forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', e => {
    const val = parseFloat(e.target.value);
    material.uniforms['u_'+id].value = val;
    document.getElementById(id+'-v').textContent = val.toFixed(2);
  });
});
document.getElementById('rotation').addEventListener('input', e => {
  const deg = parseFloat(e.target.value);
  material.uniforms.u_rotation.value = deg*Math.PI/180;
  document.getElementById('rotation-v').textContent = deg.toFixed(0);
});
['bg','sky','deep','navy'].forEach(id => {
  document.getElementById(id).addEventListener('input', e => {
    material.uniforms['u_'+id].value.setStyle(e.target.value);
  });
});

function resetParams(){
  Object.entries(DEFAULTS).forEach(([k,v]) => {
    const el = document.getElementById(k); if(!el) return;
    el.value = v;
    if (typeof v === 'number'){
      if (k==='rotation'){ material.uniforms.u_rotation.value = v*Math.PI/180; document.getElementById('rotation-v').textContent = v.toFixed(0); }
      else { material.uniforms['u_'+k].value = v; const d=document.getElementById(k+'-v'); if(d) d.textContent=v.toFixed(2); }
    } else { material.uniforms['u_'+k].value.setStyle(v); }
  });
}
function downloadImage(){ const a=document.createElement('a'); a.download='silk-wave.png'; a.href=renderer.domElement.toDataURL(); a.click(); }
function dumpValues(){
  const out = {};
  FLOATS.forEach(id => out[id] = parseFloat(document.getElementById(id).value));
  out.rotation = parseFloat(document.getElementById('rotation').value);
  ['bg','sky','deep','navy'].forEach(id => out[id] = document.getElementById(id).value);
  console.log('SILK WAVE PARAMS', JSON.stringify(out, null, 2));
  return out;
}
</script>
</body>
</html>
