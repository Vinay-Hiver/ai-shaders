<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Curved Glass Bands — POC</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#15161a; height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:'Hanken Grotesk',sans-serif; overflow:hidden; }

  /* the "right-side container" — portrait */
  .stage {
    position:relative;
    width:min(46vw,540px);
    height:100vh;
    overflow:hidden;
    background:#fff;
  }

  /* animated wave background that the glass refracts */
  .bg {
    position:absolute; inset:-8%;
    background:url('/img/wave-pattern.png') center/cover no-repeat;
    animation:drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform:scale(1.05) translate(0,0) rotate(0deg); }
    to   { transform:scale(1.18) translate(-3%,-4%) rotate(3deg); }
  }

  /* each curved glass container = a full-panel div masked to a ring */
  .band {
    position:absolute; inset:0;
    backdrop-filter:blur(1px) url(#glass) saturate(1.15);
    -webkit-backdrop-filter:blur(1px) saturate(1.15);
  }
  /* concentric rings centered at bottom-left, responsive */
  .b1 { -webkit-mask:radial-gradient(circle at 0% 100%, #000 0 25%, transparent 25%);
                 mask:radial-gradient(circle at 0% 100%, #000 0 25%, transparent 25%);
        background:rgba(219,112,112,.10); }
  .b2 { -webkit-mask:radial-gradient(circle at 0% 100%, transparent 25%, #000 25% 50%, transparent 50%);
                 mask:radial-gradient(circle at 0% 100%, transparent 25%, #000 25% 50%, transparent 50%);
        background:rgba(122,160,74,.10); }
  .b3 { -webkit-mask:radial-gradient(circle at 0% 100%, transparent 50%, #000 50% 75%, transparent 75%);
                 mask:radial-gradient(circle at 0% 100%, transparent 50%, #000 50% 75%, transparent 75%);
        background:rgba(83,92,170,.10); }
  .b4 { -webkit-mask:radial-gradient(circle at 0% 100%, transparent 75%, #000 75%);
                 mask:radial-gradient(circle at 0% 100%, transparent 75%, #000 75%);
        background:rgba(170,74,74,.10); }

  /* curved bevel/rim: thin bright arcs painted at each ring boundary */
  .rims {
    position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen;
    background:radial-gradient(circle at 0% 100%,
      transparent 24.3%, rgba(255,255,255,.85) 25%, transparent 25.7%,
      transparent 49.3%, rgba(255,255,255,.85) 50%, transparent 50.7%,
      transparent 74.3%, rgba(255,255,255,.85) 75%, transparent 75.7%);
  }
  /* thin inner shadow just inside each boundary for glass depth */
  .shadows {
    position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply;
    background:radial-gradient(circle at 0% 100%,
      transparent 22.8%, rgba(20,40,80,.18) 24%, transparent 24.6%,
      transparent 47.8%, rgba(20,40,80,.18) 49%, transparent 49.6%,
      transparent 72.8%, rgba(20,40,80,.18) 74%, transparent 74.6%);
  }

  .hint { position:fixed; top:14px; left:14px; color:#fff; opacity:.6; font-size:12px; }
</style>
</head>
<body>
  <div class="hint">4 curved glass containers (ring masks) refracting the wave · Chromium</div>
  <div class="stage">
    <div class="bg"></div>
    <div class="band b1"></div>
    <div class="band b2"></div>
    <div class="band b3"></div>
    <div class="band b4"></div>
    <div class="shadows"></div>
    <div class="rims"></div>
  </div>

  <!-- refraction filter: turbulence -> displacement of the backdrop -->
  <svg style="position:absolute;width:0;height:0">
    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.014" numOctaves="2" seed="12" result="noise">
        <animate attributeName="baseFrequency" dur="24s" repeatCount="indefinite"
                 values="0.010 0.014; 0.013 0.010; 0.010 0.014" />
      </feTurbulence>
      <feGaussianBlur in="noise" stdDeviation="0.5" result="blur" />
      <feDisplacementMap in="SourceGraphic" in2="blur" scale="55"
                         xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
</body>
</html>
